name: Scorecard

# OpenSSF Scorecard scores this repository's supply-chain posture and publishes the
# result publicly, which is the point: a README claiming "we run CodeQL" is an
# assertion, whereas a Scorecard badge is a third-party measurement.

on:
  push:
    # Scorecard only supports the default branch.
    branches:
      - master
  schedule:
    # Weekly, Saturday 01:30 UTC. Findings drift as dependencies and settings change,
    # so a one-off run would go stale.
    - cron: "30 1 * * 6"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      security-events: write   # upload SARIF to the Security tab
      id-token: write          # OIDC token, required when publish_results is true

    steps:
      # persist-credentials: false so the checked-out repo carries no writable token.
      # Scorecard checks for exactly this, and it costs nothing here.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # publish_results is what makes the badge work. It also contributes the result
      # to the OpenSSF public dataset - which is fine for a public repository, and is
      # the whole basis of the badge being independently verifiable.
      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # Puts the findings in the Security tab alongside the CodeQL alerts, rather than
      # leaving them buried in a workflow artifact nobody opens.
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: results.sarif
