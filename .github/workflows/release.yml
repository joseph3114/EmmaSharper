name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

  # Dry run. Proves the trusted-publishing chain works - the OIDC token, the
  # nuget.org policy match, and NUGET_USER - without uploading anything.
  # Worth running once before the first real tag, because otherwise a typo in
  # the policy only shows up as an opaque "no matching policy" mid-release.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Authenticate and pack, but do not push to NuGet"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: Pack & publish to NuGet
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Scopes NUGET_USER to this environment and allows an approval gate.
    environment: release

    permissions:
      id-token: write   # REQUIRED for OIDC - NuGet/login returns 403 without it
      contents: read    # setting `permissions` at all overrides the defaults

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Guards against publishing from a tag that was never merged.
      # Was `origin/main`, which does not exist in this repo.
      - name: Verify commit exists on origin/master
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*
          git branch --remote --contains | grep origin/master

      - name: Set VERSION from tag
        if: github.event_name == 'push'
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # A dry run has no tag to take a version from.
      - name: Set placeholder VERSION for dry run
        if: github.event_name == 'workflow_dispatch'
        run: echo "VERSION=0.0.0-dryrun" >> "$GITHUB_ENV"

      # Per-framework, because the test project also targets net472 and this runner
      # is Linux. A plain `dotnet build` over the solution would fail here.
      # The net472 leg is covered by the Windows job in CI on every pull request.
      - name: Test net8.0
        run: >
          dotnet test tests/EmmaSharper.Unit/EmmaSharper.Unit.csproj -f net8.0
          --configuration Release -p:Version=${VERSION}

      - name: Test net10.0
        run: >
          dotnet test tests/EmmaSharper.Unit/EmmaSharper.Unit.csproj -f net10.0
          --configuration Release -p:Version=${VERSION}

      # Packs all three target frameworks - netstandard2.0 compiles fine on Linux,
      # it is only running net472 that cannot.
      - name: Pack
        run: >
          dotnet pack ./src/EmmaSharper/EmmaSharper.csproj
          --configuration Release
          -p:Version=${VERSION} --output ./artifacts

      - name: Show package contents
        run: |
          ls -la ./artifacts
          for f in ./artifacts/*.nupkg; do
            echo "--- $f"
            unzip -l "$f" | grep -E "lib/|\.nuspec" || true
          done

      # Trusted publishing: GitHub mints a short-lived OIDC token per run, so
      # there is no long-lived API key stored anywhere.
      #
      # PREREQUISITE - create the policy once at
      # https://www.nuget.org/account/trustedpublishing
      #   Repository Owner: joseph3114
      #   Repository:       EmmaSharper
      #   Workflow File:    release.yml
      #   Environment:      release
      # This requires being an *owner* of the EmmaSharper package on nuget.org.
      # Keep the old NUGET_TOKEN secret in place until the first OIDC publish
      # succeeds - deleting it is a one-way door.
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name, NOT the email

      - name: Confirm authentication (dry run - nothing is uploaded)
        if: inputs.dry_run
        run: |
          if [ -n "${{ steps.login.outputs.NUGET_API_KEY }}" ]; then
            echo "::notice::Trusted publishing OK - nuget.org issued a short-lived key."
            echo "The policy, the OIDC token and NUGET_USER all match. Nothing was pushed."
          else
            echo "::error::NuGet/login returned no key."
            exit 1
          fi

      - name: Push
        if: ${{ !inputs.dry_run }}
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nupkg
          path: ./artifacts/*
