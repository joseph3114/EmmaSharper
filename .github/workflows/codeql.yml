name: CodeQL

# Free code scanning for public repositories. Results land in the repo's
# Security tab and annotate pull requests.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    # Weekly, so newly published queries find old code too.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      security-events: write   # required to upload the SARIF results
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@a2983b8bed1923f44751c5c43237f479442827b3 # v3.37.4
        with:
          languages: csharp
          queries: security-and-quality

      # Explicit build rather than autobuild: this solution multi-targets, and autobuild
      # picks an arbitrary TFM. One framework is enough - the source files are shared, so
      # building all three would just produce duplicate alerts. net472 cannot build here
      # anyway. The only code not analysed is the single #if NETSTANDARD2_0 branch.
      - name: Build
        run: dotnet build src/EmmaSharper/EmmaSharper.csproj -f net10.0 --configuration Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@a2983b8bed1923f44751c5c43237f479442827b3 # v3.37.4
        with:
          category: "/language:csharp"
