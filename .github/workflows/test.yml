name: CI

# NOTE: previously triggered on `main`, which does not exist in this repo -
# the default branch is `master`, so this workflow never ran.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The 10.0 SDK builds both target frameworks; the 8.0 runtime is needed
      # so the net8.0 leg of the test suite can actually execute.
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Per-framework because the test project also targets net472, which cannot run here.
      - name: Test net8.0
        run: >
          dotnet test tests/EmmaSharper.Unit/EmmaSharper.Unit.csproj -f net8.0
          --configuration Release
          --logger "trx;LogFileName=net8.trx"
          --collect:"XPlat Code Coverage"

      - name: Test net10.0
        run: >
          dotnet test tests/EmmaSharper.Unit/EmmaSharper.Unit.csproj -f net10.0
          --configuration Release
          --logger "trx;LogFileName=net10.trx"
          --collect:"XPlat Code Coverage"

      # Compile-only here; net472 in the job below is what actually exercises this leg.
      - name: Verify netstandard2.0 compiles
        run: dotnet build src/EmmaSharper/EmmaSharper.csproj -f netstandard2.0 --configuration Release

      # The samples are the documented usage patterns in compilable form. Building them here is
      # what stops the examples rotting: a rename in the library fails this step instead of
      # quietly leaving the wiki wrong.
      - name: Build samples
        run: dotnet build samples/EmmaSharper.Samples/EmmaSharper.Samples.csproj --configuration Release

      # Both test steps emit a Cobertura file; ReportGenerator merges them so the figure
      # reflects the union of the net8.0 and net10.0 runs rather than whichever ran last.
      # `MarkdownSummaryGithub` writes straight to the job summary, so coverage is visible
      # on the run page instead of buried in a downloadable artifact nobody opens.
      - name: Coverage summary
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # 5.5.11
        with:
          reports: "**/TestResults/**/coverage.cobertura.xml"
          targetdir: coveragereport
          reporttypes: MarkdownSummaryGithub;Cobertura
          title: EmmaSharper

      - name: Publish coverage to the job summary
        if: always()
        run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # Codecov adds the two things a job summary cannot: a trend over time, and a comment
      # on each pull request scoped to the lines that PR actually changed.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coveragereport/Cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          # A coverage upload failing must never fail the build - it reports on the tests,
          # it is not one of them.
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: |
            **/TestResults/**
            coveragereport/**
          if-no-files-found: ignore

  # Runs the netstandard2.0 build of the library on a real .NET Framework runtime.
  # Without this, netstandard2.0 would only ever be compile-checked.
  test-netfx:
    name: Build & test (.NET Framework)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Test net472
        run: >
          dotnet test tests/EmmaSharper.Unit/EmmaSharper.Unit.csproj -f net472
          --configuration Release
          --logger "trx;LogFileName=net472.trx"
